{% extends "base.html" %}
{% block content %}
<h1>Запуск #{{ r.id }} · {{ r.graph_name }}
  <span class="badge b-{{ r.status }}">{{ r.status }}</span></h1>
<div class="meta" style="margin-bottom:14px">
  Клиент: {{ r.tenant_name }} · начат {{ r.started_at }} · завершён {{ r.finished_at or "…" }}
</div>
<div class="card">
  <div class="post-text">{{ r.output or "(пусто)" }}</div>
</div>
<p><a href="/runs">← к журналу запусков</a></p>
{% endblock %}
